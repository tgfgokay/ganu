  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- adres / koordinat plakası motifi (hero ile aynı dil) -->
  <g transform="translate(1015,312)">
    <g stroke="#F4EFE7" stroke-opacity="0.06" stroke-width="1">
      <line x1="-240" y1="-170" x2="-240" y2="170"/>
      <line x1="-160" y1="-170" x2="-160" y2="170"/>
      <line x1="-80"  y1="-170" x2="-80"  y2="170"/>
      <line x1="0"    y1="-170" x2="0"    y2="170"/>
      <line x1="80"   y1="-170" x2="80"   y2="170"/>
      <line x1="160"  y1="-170" x2="160"  y2="170"/>
      <line x1="-240" y1="-160" x2="160" y2="-160"/>
      <line x1="-240" y1="-80"  x2="160" y2="-80"/>
      <line x1="-240" y1="0"    x2="160" y2="0"/>
      <line x1="-240" y1="80"   x2="160" y2="80"/>
      <line x1="-240" y1="160"  x2="160" y2="160"/>
