# ============================================================
# GANU · Production gate CI (ŞABLON)
# ------------------------------------------------------------
# GitHub Actions bunu YALNIZ repo kökündeki .github/workflows/ altında çalıştırır.
# Kurulum: bu dosyayı repo köküne kopyala:
#   mkdir -p .github/workflows && cp web/ci/prod-gate.workflow.yml .github/workflows/prod-gate.yml
# (Bu commit yalnız web/ altını değiştirir; taşımayı sen yaparsın.)
#
# Secret gerekir (repoya konmaz): PROD_DB_URL = prod/staging connection string.
# Prod deploy job'ları bu gate'e `needs: gate` ile bağlanmalı → FAIL ise deploy DURUR.
# ============================================================
name: prod-gate
on:
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Production readiness gate
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
          # POS_TEST_FAULT bilerek TANIMLANMAZ → script boş olduğunu doğrular.
        run: bash web/scripts/prod-gate.sh
