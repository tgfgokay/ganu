<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" font-family="Manrope, 'Segoe UI', Arial, sans-serif">
  <!-- İkon-only avatar: lacivert zemin + amber kapı + tabela -->
  <rect width="240" height="240" rx="48" fill="#1B2A4A"/>
  <!-- kapı gövdesi (çerçeve) -->
  <rect x="80" y="48" width="80" height="144" rx="10" fill="none" stroke="#F2A93B" stroke-width="6"/>
  <!-- üst alın kirişi -->
  <rect x="90" y="60" width="60" height="6" rx="3" fill="#F2A93B"/>
  <!-- pirinç tabela -->
  <rect x="96" y="82" width="48" height="26" rx="5" fill="#F2A93B"/>
  <text x="120" y="95.5" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="800" fill="#1B2A4A">GANU</text>
  <!-- alt kapı paneli (gömme) -->
  <rect x="94" y="124" width="52" height="52" rx="6" fill="none" stroke="#F2A93B" stroke-width="3"/>
  <!-- kapı kolu -->
  <circle cx="148" cy="150" r="5.5" fill="#F2A93B"/>
</svg>
