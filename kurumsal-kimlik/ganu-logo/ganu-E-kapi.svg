<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" font-family="Manrope, 'Segoe UI', Arial, sans-serif">
  <rect width="470" height="150" fill="#FFFFFF"/>
  <!-- Konsept E: Kapı + pirinç tabela (prestijli adres = sanal ofis) -->
  <!-- kapı gövdesi -->
  <rect x="34" y="18" width="80" height="116" rx="9" fill="#1B2A4A"/>
  <!-- üst alın kirişi -->
  <rect x="42" y="26" width="64" height="6" rx="3" fill="#FFFFFF" opacity="0.14"/>
  <!-- pirinç tabela (şirket adının yeri) -->
  <rect x="50" y="46" width="48" height="22" rx="4" fill="#F2A93B"/>
  <text x="74" y="57.5" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="800" fill="#1B2A4A">GANU</text>
  <!-- alt kapı paneli (gömme) -->
  <rect x="48" y="80" width="52" height="44" rx="5" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.16"/>
  <!-- kapı kolu -->
  <circle cx="102" cy="100" r="4.2" fill="#F2A93B"/>
  <!-- wordmark -->
  <text x="150" y="64" dominant-baseline="central" font-size="54" font-weight="800" letter-spacing="2" fill="#1B2A4A">GANU</text>
  <text x="153" y="100" dominant-baseline="central" font-size="13" font-weight="600" letter-spacing="5" fill="#1B2A4A" opacity="0.65">SANAL OFİS</text>
</svg>
