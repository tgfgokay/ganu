<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" font-family="Manrope, 'Segoe UI', Arial, sans-serif">
  <rect width="470" height="150" fill="#FFFFFF"/>
  <!-- Konsept F: Aydınlık Cephe — prestijli binada, senin işin de "ışık yakıyor" -->
  <!-- bina gövdesi -->
  <rect x="30" y="22" width="96" height="106" rx="10" fill="#1B2A4A"/>
  <!-- pencereler (3x3) — bazıları amber "dolu/ışıkta" -->
  <!-- satır 1 -->
  <rect x="44" y="36" width="20" height="16" rx="3" fill="#FFFFFF" opacity="0.14"/>
  <rect x="68" y="36" width="20" height="16" rx="3" fill="#F2A93B"/>
  <rect x="92" y="36" width="20" height="16" rx="3" fill="#FFFFFF" opacity="0.14"/>
  <!-- satır 2 -->
  <rect x="44" y="60" width="20" height="16" rx="3" fill="#F2A93B"/>
  <rect x="68" y="60" width="20" height="16" rx="3" fill="#FFFFFF" opacity="0.14"/>
  <rect x="92" y="60" width="20" height="16" rx="3" fill="#FFFFFF" opacity="0.14"/>
  <!-- satır 3 -->
  <rect x="44" y="84" width="20" height="16" rx="3" fill="#FFFFFF" opacity="0.14"/>
  <rect x="68" y="84" width="20" height="16" rx="3" fill="#FFFFFF" opacity="0.14"/>
  <rect x="92" y="84" width="20" height="16" rx="3" fill="#F2A93B"/>
  <!-- giriş kapısı (amber) -->
  <rect x="68" y="108" width="20" height="20" rx="3" fill="#F2A93B"/>
  <!-- wordmark -->
  <text x="150" y="64" dominant-baseline="central" font-size="54" font-weight="800" letter-spacing="2" fill="#1B2A4A">GANU</text>
  <text x="153" y="100" dominant-baseline="central" font-size="13" font-weight="600" letter-spacing="5" fill="#1B2A4A" opacity="0.65">SANAL OFİS</text>
</svg>
