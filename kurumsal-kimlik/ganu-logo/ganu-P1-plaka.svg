<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <!-- P1: Plaka — kazınmış pirinç levha hissi. Italiana serif, Mürekkep & Kemik paleti -->
  <rect width="640" height="400" fill="#F3EFE7"/>
  <!-- ince çift keyline çerçeve (levha) -->
  <rect x="46" y="46" width="548" height="308" fill="none" stroke="#1B1A17" stroke-width="1.4"/>
  <rect x="54" y="54" width="532" height="292" fill="none" stroke="#1B1A17" stroke-width="0.7" opacity="0.55"/>
  <!-- üst etiket -->
  <text x="320" y="120" text-anchor="middle" font-family="Italiana, serif" font-size="15" letter-spacing="9" fill="#9A7B43">İSTANBUL</text>
  <!-- wordmark -->
  <text x="320" y="218" text-anchor="middle" font-family="Italiana, serif" font-size="104" letter-spacing="14" fill="#1B1A17">GANU</text>
  <!-- hairline ayraç + iki nokta -->
  <line x1="250" y1="252" x2="390" y2="252" stroke="#9A7B43" stroke-width="1"/>
  <circle cx="320" cy="252" r="2.4" fill="#9A7B43"/>
  <!-- alt etiket -->
  <text x="320" y="292" text-anchor="middle" font-family="Italiana, serif" font-size="17" letter-spacing="13" fill="#1B1A17">SANAL OFİS</text>
</svg>
