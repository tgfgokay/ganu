<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 150" font-family="Manrope, 'Segoe UI', Arial, sans-serif">
  <rect width="470" height="150" fill="#FFFFFF"/>
  <!-- Konsept H: Mühür — istiflenmiş GA / NU bloğu, editoryal damga hissi -->
  <rect x="28" y="22" width="104" height="104" rx="20" fill="#1B2A4A"/>
  <text x="80" y="62" text-anchor="middle" dominant-baseline="central" font-size="40" font-weight="800" letter-spacing="2" fill="#FFFFFF">GA</text>
  <text x="80" y="98" text-anchor="middle" dominant-baseline="central" font-size="40" font-weight="800" letter-spacing="2" fill="#F2A93B">NU</text>
  <!-- ayraç çizgi -->
  <line x1="46" y1="78" x2="114" y2="78" stroke="#FFFFFF" stroke-width="1.5" opacity="0.18"/>
  <!-- wordmark -->
  <text x="166" y="62" dominant-baseline="central" font-size="50" font-weight="800" letter-spacing="2" fill="#1B2A4A">GANU</text>
  <text x="169" y="98" dominant-baseline="central" font-size="13" font-weight="600" letter-spacing="5" fill="#1B2A4A" opacity="0.65">SANAL OFİS</text>
</svg>
