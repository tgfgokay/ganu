name: marketing-pages-deploy
run-name: Marketing Pages deploy (sales closed, staff beta opt-in)

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marketing-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GANU_MARKETING_ONLY: ${{ vars.GANU_MARKETING_ONLY }}
      GANU_STAFF_PANEL: ${{ vars.GANU_STAFF_PANEL_ENABLED }}
      GANU_SITE_URL: https://ganu.com.tr
      GANU_BASE: /
      VITE_SUPABASE_URL: ${{ vars.GANU_STAFF_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.GANU_STAFF_SUPABASE_ANON_KEY }}
      # Hukuki metinlerin satıcı/veri sorumlusu kimliği — kamuya açık sicil bilgisi (web/src/site/company.js ile aynı).
      # Metinler 29.09.2026'da şirket tarafından onaylandı; yurt dışı aktarım: panel verisi Supabase (Singapur),
      # KVKK m.9 uygun güvence (standart sözleşme + Kurul bildirimi).
      GANU_LEGAL_TRADE_NAME: GANU OFİS HİZMETLERİ LİMİTED ŞİRKETİ
      GANU_LEGAL_ADDRESS: Kavacık Mah. Okul Cad. No:29 Kat:4 D.8 (Teras Katı) Beykoz / İstanbul
      GANU_LEGAL_TAX_OFFICE: Beykoz
      GANU_LEGAL_TAX_NUMBER: '3892020110'
      GANU_LEGAL_MERSIS_NUMBER: '0389202011000001'
      GANU_LEGAL_REGISTRY_OFFICE: İstanbul Ticaret Sicili Müdürlüğü
      GANU_LEGAL_REGISTRY_NUMBER: '1155060'
      GANU_LEGAL_EMAIL: info@ganu.com.tr
      GANU_LEGAL_PHONE: 0537 974 62 90
      GANU_LEGAL_APPROVED_AT: '2026-09-29'
      GANU_LEGAL_TEXT_VERSION: 2026-08-15.v1
      GANU_LEGAL_RETENTION_VERSION: 2026-08-15.v1
      GANU_LEGAL_CROSS_BORDER_STATUS: appropriate-safeguards
      GANU_LEGAL_CONSENT_FLOW_VERSION: '0009'
    steps:
      - uses: actions/checkout@v7
      - name: Fail closed on target and mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tgfgokay/ganu"
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GANU_MARKETING_ONLY" = "true"
          test "$GANU_STAFF_PANEL" = "true"
          test -n "${VITE_SUPABASE_URL:-}"
          test -n "${VITE_SUPABASE_ANON_KEY:-}"
          test "$VITE_SUPABASE_URL" = "https://fhtcrvzwbqcfzceqolyz.supabase.co"
          pages="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/$GITHUB_REPOSITORY/pages)"
          test "$(jq -r .https_enforced <<<"$pages")" = "true"
          test "$(jq -r .cname <<<"$pages")" = "ganu.com.tr"
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm audit --audit-level=low
        working-directory: web
      - name: Build and verify sales-closed staff beta artifact
        working-directory: web
        run: |
          npm run build
          node scripts/check-staff-panel.mjs
          test "$(cat dist/CNAME)" = "ganu.com.tr"
      - name: Verify Pages Actions source after artifact gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/$GITHUB_REPOSITORY/pages)"
          test "$(jq -r .build_type <<<"$pages")" = "workflow"
          test "$(jq -r .https_enforced <<<"$pages")" = "true"
          test "$(jq -r .cname <<<"$pages")" = "ganu.com.tr"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy sales-closed staff beta artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify strict HTTPS public surface
        run: |
          set -euo pipefail
          for path in / /en/ /blog/ /en/blog/ /satin-al/; do
            result="$(curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --write-out '%{http_code}|%{url_effective}' --output "/tmp/page.html" "https://ganu.com.tr$path")"
            test "$result" = "200|https://ganu.com.tr$path"
          done
          grep -q 'data-marketing-only="sales-closed"' /tmp/page.html
