name: einvoice-daily
run-name: Günlük otomatik e-Belge (${{ inputs.mode || 'kesim' }})

# Her sabah 09:00 (İstanbul) auto-einvoice fonksiyonunu çağırır: ödenmiş ama e-Belgesi kesilmemiş faturaları keser
# (0016 einvoice_auto_candidates: ödeme son 7 gün, hiç denenmemiş, müşteri fatura bilgileri tam). Asıl tetikleyici
# ödeme anıdır (panel "Ödendi (elle)" › hemen kes, PayTR bildirimi); bu iş kaçanları yakalar.
# Kesim için Supabase'de EINVOICE_AUTO_DAILY=true gerekir; yoksa yalnız liste döner.
# Gerekli: repository secret EINVOICE_CRON_SECRET (Supabase'deki aynı değer). Tanımlı değilse koşu uyarıyla atlanır.
# Repo herkese açık: kayıtta müşteri adı/tutar yok, yalnız sayılar, fatura kimliği ve e-belge numarası.
# Başarısız kesim olursa iş kırmızı biter (GitHub e-posta bildirimi); panelde fatura "başarısız" görünür.
# Önce parasut-sync (0017): Paraşüt'te kesilen belgeler panele bağlanır, Paraşüt'te kapanan faturalar (iyzico kart /
# havale) panelde ödendi olur, panelde ödenip Paraşüt'te açık kalanlara tahsilat girilir. dry_run'da hiçbir şey yazılmaz.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: dry_run = yalnız raporla (yazma yok) · kesim = eşitle ve belgeleri kes
        required: true
        default: dry_run
        type: choice
        options: [dry_run, kesim]

permissions:
  contents: read

concurrency:
  group: einvoice-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ vars.GANU_STAFF_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.GANU_STAFF_SUPABASE_ANON_KEY }}
      CRON_SECRET: ${{ secrets.EINVOICE_CRON_SECRET }}
      MODE: ${{ inputs.mode || 'kesim' }}
    steps:
      - name: Fail closed on target
        id: guard
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "tgfgokay/ganu"
          test "$SUPABASE_URL" = "https://fhtcrvzwbqcfzceqolyz.supabase.co"
          test -n "${SUPABASE_ANON_KEY:-}"
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::EINVOICE_CRON_SECRET tanımlı değil; otomatik e-Belge atlandı."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Call parasut-sync
        if: steps.guard.outputs.skip != '1'
        run: |
          set -euo pipefail
          dry=false; [ "$MODE" = "dry_run" ] && dry=true
          out=$(curl -sS --max-time 600 -w '\n%{http_code}' -X POST "$SUPABASE_URL/functions/v1/parasut-sync" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "apikey: $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" \
            -d "{\"dry_run\": $dry}")
          code=$(printf '%s' "$out" | tail -n1); body=$(printf '%s' "$out" | sed '$d')
          echo "HTTP $code"
          printf '%s' "$body" | jq -c '{dry_run, scanned, imported, paid, pushed, skipped, errors, error, message, items: (.items // [] | map({parasut_id, invoice_no, action, method, reason}))}' || printf '%s\n' "${body:0:300}"
          case "$code" in
            200) ;;
            207) echo "::error::Paraşüt eşitlemesinde hata olan faturalar var; rapordaki 'hata' satırlarına bakın."; exit 1 ;;
            *) echo "::error::parasut-sync HTTP $code"; exit 1 ;;
          esac

      # Eşitleme hata verse de ödenmiş faturaların kesimi yapılır; iş yine kırmızı biter.
      - name: Call auto-einvoice
        if: ${{ !cancelled() && steps.guard.outputs.skip != '1' }}
        run: |
          set -euo pipefail
          dry=false; [ "$MODE" = "dry_run" ] && dry=true
          out=$(curl -sS --max-time 600 -w '\n%{http_code}' -X POST "$SUPABASE_URL/functions/v1/auto-einvoice" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H "apikey: $SUPABASE_ANON_KEY" \
            -H "x-cron-secret: $CRON_SECRET" -H "Content-Type: application/json" \
            -d "{\"dry_run\": $dry}")
          code=$(printf '%s' "$out" | tail -n1); body=$(printf '%s' "$out" | sed '$d')
          echo "HTTP $code"
          printf '%s' "$body" | jq -c '{mode, count, issued, failed, message, candidates: (.candidates // [] | map({invoice_id, issue_date})), results: (.results // [] | map({invoice_id, state, einvoice_no}))}' || printf '%s\n' "${body:0:300}"
          case "$code" in
            200) ;;
            207) echo "::error::Bazı faturalar kesilemedi; panelde 'başarısız' olanları kontrol edin."; exit 1 ;;
            *) echo "::error::auto-einvoice HTTP $code"; exit 1 ;;
          esac
