name: prod-readiness-check
run-name: Production readiness check (deployment yapmaz)

permissions:
  contents: read

on:
  workflow_dispatch: {}
  workflow_call: {}

jobs:
  gate:
    name: Readiness gate (deploy entegrasyonu gerekli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require real production deploy integration
        env:
          PROD_DEPLOY_INTEGRATED: ${{ vars.PROD_DEPLOY_INTEGRATED }}
        run: |
          if [ "$PROD_DEPLOY_INTEGRATED" != "true" ]; then
            echo "::error::Bu repoda production deploy job'ı gate'e bağlı değil. Readiness PASS/deploy engelleme iddiası geçersiz; entegrasyon tamamlanana kadar hard-fail."
            exit 4
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Production readiness gate
        env:
          DB_URL: ${{ secrets.PROD_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          ADMIN_GATE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/admin-gate
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PROD_OWNER_ACCESS_TOKEN: ${{ secrets.PROD_OWNER_ACCESS_TOKEN }}
          PROD_GATE_HMAC_SECRET: ${{ secrets.PROD_GATE_HMAC_SECRET }}
        run: bash web/scripts/prod-gate.sh
